[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitty-omics"
version = "0.1.0"
description = "Open-source supervised univariate analysis for omics matrices"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-or-later"
dependencies = [
  "PySide6==6.11.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
kitty = "kitty.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

